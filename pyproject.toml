[project]
name = "NBA-Scene-Reconstruction"
version = "0.1.0"
description = "A web API built with FastAPI"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
]

[project.optional-dependencies]
gpu = [
    "inference-gpu>=1.3.7",
]

[tool.fastapi]
entrypoint = "app.main:app"
